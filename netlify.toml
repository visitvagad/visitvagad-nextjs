# Netlify Build Configuration for VisitVagad Next.js

[build]
  command = "npm run build"
  publish = ".next"

# CRITICAL: Override NODE_ENV to allow devDependencies installation
# Netlify sets NODE_ENV=production by default, which prevents npm from installing
# build tools like @tailwindcss/postcss and other devDependencies.
# We set it to empty string to allow npm install to work, then Next.js will
# auto-detect production mode from the build context anyway.
[build.environment]
  NODE_ENV = ""

# Next.js runtime configuration for Netlify
[functions]
  node_bundler = "esbuild"

# Redirects and rewrites
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control headers
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
